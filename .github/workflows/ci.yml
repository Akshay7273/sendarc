name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Concurrency configuration:
# - PR runs: grouped by PR number with cancel-in-progress: true so new pushes cancel stale PR checks.
# - Push runs (main): grouped by unique commit SHA with cancel-in-progress: false so every canonical main SHA receives its own durable validation without being cancelled by later pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metadata:
    name: metadata & attribution hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PR metadata and title formatting
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Validating PR #$PR_NUMBER title: '$PR_TITLE'"
          # 1. Validate conventional commit format: type(scope)?: description
          if ! echo "$PR_TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?: .+'; then
            echo "::error::PR title must follow Conventional Commits format (e.g. 'feat: description' or 'chore(ci): description')."
            exit 1
          fi

          # 2. Check for manual/hardcoded PR number suffixes in PR title itself (GitHub appends ' (#<pr>)' automatically on squash merge)
          if echo "$PR_TITLE" | grep -Eq '\(#[0-9]+\)$'; then
            echo "::error::PR title should NOT include a manual '(#...)' suffix. GitHub adds ' (#$PR_NUMBER)' automatically upon squash merge."
            exit 1
          fi

          # 3. Check for planning/internal task IDs in title
          if echo "$PR_TITLE" | grep -Eiq 'V[0-9]+-PR[0-9]+'; then
            echo "::error::PR title must not contain internal planning tags (e.g. V14-PR04)."
            exit 1
          fi

      - name: Guard against AI/tool contributor attribution
        run: |
          # Check commit messages in the current branch/PR against known automated coding-agent attribution trailers
          FORBIDDEN_PATTERNS='(Generated with Codebuff|Co-Authored-By:.*Codebuff|Freebuff|AI-generated-by|tool-generated-by|generated-by:)'

          # Inspect commit range
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            COMMITS=$(git rev-list "$BASE_SHA..$HEAD_SHA" || true)
          else
            # On direct push, check the pushed commits
            COMMITS="${{ github.sha }}"
          fi

          for c in $COMMITS; do
            MSG=$(git log -1 --format='%B' "$c")
            AUTHOR=$(git log -1 --format='%an <%ae>' "$c")
            COMMITTER=$(git log -1 --format='%cn <%ce>' "$c")

            FULL_META="$AUTHOR"$'\n'"$COMMITTER"$'\n'"$MSG"
            if echo "$FULL_META" | grep -Eiq "$FORBIDDEN_PATTERNS"; then
              echo "::error::Commit $c contains forbidden automated agent attribution in metadata."
              exit 1
            fi
          done
          echo "Attribution hygiene check passed."

  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build protocol package
        run: pnpm --filter @sendbeam/protocol build

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  e2e:
    name: e2e (chromium, firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/server/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build protocol package
        run: pnpm --filter @sendbeam/protocol build

      - name: Install Playwright browsers
        run: pnpm --filter @sendbeam/web exec playwright install --with-deps chromium firefox

      - name: Run e2e
        run: pnpm --filter @sendbeam/web e2e

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  go:
    name: ${{ matrix.module }} (vet, test, build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [packages/wire, packages/engine, apps/server, apps/cli]
    # Build each module standalone (as it is published) rather than through the
    # workspace, so intra-repo replace directives are exercised the way a consumer
    # pulling one module would resolve them.
    env:
      GOWORK: off
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}

  desktop:
    # V14-PR02: the desktop shell. Server-tagged gates run headless (no GUI deps); the window
    # build needs the Linux WebView stack, installed here. The window itself is exercised on
    # real platform builds (V14-PR05); this job proves it compiles on a clean Ubuntu runner.
    name: desktop (server gates + window build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/desktop/go.sum

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-webkit-${{ hashFiles('apps/desktop/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-apt-webkit-

      - name: Install Linux WebView deps (window build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./internal/...

      - name: Build window
        run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: apps/desktop

  branding:
    name: branding (no stale SendArc references)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against stale branding
        run: |
          if grep -rInE "sendarc|SendArc|SENDARC" \
            --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules --exclude-dir=dist \
            --exclude-dir=.svelte-kit --exclude-dir=test-results \
            --exclude-dir=playwright-report --exclude-dir=coverage .; then
            echo "::error::Stale 'sendarc' branding found (repo was renamed to SendBeam)."
            exit 1
          fi

  docker:
    name: container (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t sendbeam .

      - name: Smoke test
        run: |
          docker run -d --name sendbeam-smoke -p 127.0.0.1:8443:8443 sendbeam
          trap 'docker rm -f sendbeam-smoke >/dev/null 2>&1' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8443/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8443/healthz | grep -q '"ok"'
          curl -fsS http://127.0.0.1:8443/ | grep -q '<title>SendBeam'
          curl -fsS http://127.0.0.1:8443/ | grep -q 'integrity="sha384-'
