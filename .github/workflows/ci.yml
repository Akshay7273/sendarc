name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build protocol package
        run: pnpm --filter @sendbeam/protocol build

      - name: Check formatting
        run: pnpm run format:check

      - name: Format
        run: pnpm run format

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  e2e:
    name: e2e (chromium, firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: apps/server/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build protocol package
        run: pnpm --filter @sendbeam/protocol build

      - name: Install Playwright browsers
        run: pnpm --filter @sendbeam/web exec playwright install --with-deps chromium firefox

      - name: Run e2e
        run: pnpm --filter @sendbeam/web e2e

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  go:
    name: ${{ matrix.module }} (vet, test, build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [packages/wire, apps/server, apps/cli]
    # Build each module standalone (as it is published) rather than through the
    # workspace, so intra-repo replace directives are exercised the way a consumer
    # pulling one module would resolve them.
    env:
      GOWORK: off
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}

  branding:
    name: branding (no stale SendArc references)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against stale branding
        run: |
          if grep -rInE "sendarc|SendArc|SENDARC" \
            --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules --exclude-dir=dist \
            --exclude-dir=.svelte-kit --exclude-dir=test-results \
            --exclude-dir=playwright-report --exclude-dir=coverage .; then
            echo "::error::Stale 'sendarc' branding found (repo was renamed to SendBeam)."
            exit 1
          fi

  docker:
    name: container (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t sendbeam .

      - name: Smoke test
        run: |
          docker run -d --name sendbeam-smoke -p 127.0.0.1:8443:8443 sendbeam
          trap 'docker rm -f sendbeam-smoke >/dev/null 2>&1' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8443/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8443/healthz | grep -q '"ok"'
          curl -fsS http://127.0.0.1:8443/ | grep -q '<title>SendBeam'
          curl -fsS http://127.0.0.1:8443/ | grep -q 'integrity="sha384-'
